services:
  warp:
    image: caomingjun/warp:latest
    restart: unless-stopped
    environment:
      WARP_SLEEP: 2
    cap_add:
      - NET_ADMIN
    ports:
      - "${WARP_HOST:-0.0.0.0}:${WARP_HOST_PORT:-1080}:1080"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1080 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - grok_internal

  app:
    build:
      context: .
      dockerfile: deploy/vps/Dockerfile
    env_file:
      - .env.vps
    environment:
      WEB_HOST: 0.0.0.0
      WEB_PORT: 5000
      WEB_THREADS: 16
      TRUST_PROXY_HEADERS: "1"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./config.json:/app/config.json
      - ./accounts_cli.txt:/app/accounts_cli.txt
      - ./emails_used.txt:/app/emails_used.txt
      - ./emails_error.txt:/app/emails_error.txt
      - ./cpa_auths:/app/cpa_auths
      - ./cookies:/app/cookies
      - ./screenshots:/app/screenshots
    shm_size: 2gb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - grok_internal

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set in .env.vps}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - grok_internal

networks:
  grok_internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
